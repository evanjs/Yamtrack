<div role="tablist" aria-label="{{ taxonomy_label }} facet types" class="flex gap-1 border-b border-gray-600">
  {% for facet, options in taxonomy_options.items %}
    <button type="button"
            role="tab"
            id="taxonomy-tab-{{ facet }}"
            aria-controls="taxonomy-panel-{{ facet }}"
            :aria-selected="activeFacet === '{{ facet }}'"
            :tabindex="activeFacet === '{{ facet }}' ? 0 : -1"
            @click="activeFacet = '{{ facet }}'"
            @keydown.right.prevent="$el.parentElement.querySelectorAll('[role=tab]')[(Array.from($el.parentElement.querySelectorAll('[role=tab]')).indexOf($el) + 1) % {{ taxonomy_options|length }}].focus()"
            @keydown.left.prevent="$el.parentElement.querySelectorAll('[role=tab]')[(Array.from($el.parentElement.querySelectorAll('[role=tab]')).indexOf($el) + {{ taxonomy_options|length }} - 1) % {{ taxonomy_options|length }}].focus()"
            class="px-2 py-2 text-sm font-medium border-b-2"
            :class="activeFacet === '{{ facet }}' ? 'border-indigo-400 text-white' : 'border-transparent text-gray-400 hover:text-white'">
      {{ facet|title }}
      <span class="ml-1 text-xs text-indigo-200" x-text="selectedCounts['{{ facet }}']"></span>
    </button>
  {% endfor %}
</div>
{% for facet, options in taxonomy_options.items %}
  <fieldset role="tabpanel"
            id="taxonomy-panel-{{ facet }}"
            aria-labelledby="taxonomy-tab-{{ facet }}"
            x-show="activeFacet === '{{ facet }}'"
            x-data="{ needle: '' }"
            class="pt-3">
    <p class="text-xs text-gray-400 mb-2">Click a value to include (+), exclude (−), or ignore (·).</p>
    <input type="search"
           x-model="needle"
           placeholder="Find {{ facet }}..."
           aria-label="Find {{ facet }}"
           class="w-full mb-2 px-2 py-1 rounded bg-[#2a2f35] text-white text-sm">
    <div class="max-h-80 overflow-y-auto space-y-1">
      {% for option in options %}
        <div x-show="!needle || '{{ option.name|escapejs }}'.toLowerCase().includes(needle.toLowerCase())"
             class="flex items-start gap-2 text-sm text-gray-200">
          <span x-data="{ state: '{{ option.state }}' }" class="flex items-center gap-2">
            <input type="hidden"
                   name="{{ facet }}"
                   value="{{ option.provider_id }}"
                   :disabled="state !== 'include'">
            <input type="hidden"
                   name="{{ facet }}_exclude"
                   value="{{ option.provider_id }}"
                   :disabled="state !== 'exclude'">
            <button type="button"
                    class="w-6 h-6 rounded border text-xs font-bold"
                    :class="state === 'include' ? 'bg-indigo-600 border-indigo-400 text-white' : state === 'exclude' ? 'bg-red-900 border-red-400 text-white' : 'bg-[#2a2f35] border-gray-600 text-gray-400'"
                    :aria-label="'{{ option.name|escapejs }}: ' + state + '. Click to change filter state.'"
                    @click="const wasActive = state !== 'neutral'; state = state === 'neutral' ? 'include' : state === 'include' ? 'exclude' : 'neutral'; selectedCounts['{{ facet }}'] += (state !== 'neutral' ? 1 : 0) - (wasActive ? 1 : 0); $nextTick(() => $dispatch('change'))"
                    x-text="state === 'include' ? '+' : state === 'exclude' ? '−' : '·'"></button>
          </span>
          <span>{{ option.name }}</span>
        </div>
      {% endfor %}
    </div>
  </fieldset>
{% endfor %}
