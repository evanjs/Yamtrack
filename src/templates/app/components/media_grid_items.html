{% load app_tags %}

{% for media in media_list %}
  <div {% if forloop.last and media_list.has_next %} hx-get="{% url 'medialist' target_user.username media_type %}?page={{ media_list.next_page_number }}" hx-trigger="revealed threshold:200px" hx-swap="afterend" hx-include="#filter-form,#taxonomy-filter-form,#credit-filter-form" hx-indicator="#loading-indicator" {% endif %}>
    {% include "app/components/media_card.html" with media=media item=media.item title=media.item from_grid=True %}
  </div>
{% empty %}
  <div class="col-span-full rounded-lg bg-[#2a2f35] py-10 text-center text-gray-400">No {{ media_type_plural }} match these filters.</div>
{% endfor %}
